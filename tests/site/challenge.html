<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Human check</title>
<style>
  body { font-family: Arial; margin: 30px }
  #grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 6px; margin: 16px 0 }
  .tile { width: 100px; height: 100px; border: 4px solid transparent; box-sizing: border-box }
  .tile.on { border-color: #1a73e8 }
  .red { background: #d93025 } .green { background: #1e8e3e } .yellow { background: #f9ab00 } .blue { background: #4285f4 }
  #verify { padding: 10px 22px; font-size: 16px }
</style></head>
<body>
<h2>Select all the red squares</h2>
<div id="grid">
  <div class="tile red"></div><div class="tile green"></div><div class="tile yellow"></div>
  <div class="tile blue"></div><div class="tile red"></div><div class="tile green"></div>
  <div class="tile yellow"></div><div class="tile blue"></div><div class="tile red"></div>
</div>
<button id="verify" type="button">Verify</button>
<p id="out"></p>
<script>
  var tiles = Array.from(document.querySelectorAll('.tile'));
  tiles.forEach(function (tile) { tile.addEventListener('click', function () { tile.classList.toggle('on'); }); });
  document.getElementById('verify').addEventListener('click', function () {
    var ok = tiles.every(function (tile) { return tile.classList.contains('on') === tile.classList.contains('red'); });
    document.getElementById('out').textContent = ok ? 'Verified. Thanks, you are human.' : 'Try again.';
  });
</script>
</body></html>
