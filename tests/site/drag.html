<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Drag</title>
<style>
  body { margin: 0; font-family: Arial }
  #box { position: absolute; left: 50px; top: 150px; width: 80px; height: 50px; background: #4363d8; color: #fff; cursor: grab }
  #zone { position: absolute; left: 400px; top: 130px; width: 200px; height: 100px; border: 2px dashed #888 }
  #out { position: absolute; left: 50px; top: 300px }
</style></head>
<body>
<div id="box">drag me</div>
<div id="zone">drop here</div>
<p id="out">Not dropped</p>
<script>
  var box = document.getElementById('box');
  var zone = document.getElementById('zone');
  var out = document.getElementById('out');
  var dragging = false;
  box.addEventListener('mousedown', function () { dragging = true; });
  window.addEventListener('mousemove', function (event) {
    if (dragging) {
      box.style.left = (event.clientX - 40) + 'px';
      box.style.top = (event.clientY - 25) + 'px';
    }
  });
  window.addEventListener('mouseup', function (event) {
    if (!dragging) return;
    dragging = false;
    var r = zone.getBoundingClientRect();
    if (event.clientX >= r.left && event.clientX <= r.right && event.clientY >= r.top && event.clientY <= r.bottom) {
      out.textContent = 'Dropped in the zone';
    }
  });
</script>
</body></html>
