name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline tests on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Install the project
        run: uv pip install -e ".[dev]"

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Check that the console scripts are installed
        run: |
          uv run mmjb --version
          uv run python -c "import mmjb; print(mmjb.__version__)"

      - name: Run the tests
        # No API keys are set, so the tests marked live skip themselves.
        run: uv run pytest -q

      - name: Check that the package builds
        run: uv build

  doctor:
    name: doctor on macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Install the project
        run: uv pip install -e ".[dev]"

      - name: Install Chromium
        run: uv run playwright install chromium

      - name: The doctor report with no keys must say what to fix and exit non-zero
        run: |
          set +e
          uv run mmjb doctor
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "doctor exited 0 with no decision model configured, which cannot happen"
            exit 1
          fi