<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Request a demo - Acme Cloud</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><span class="logo">Acme Cloud</span><nav><a href="#">Pricing</a><a href="#">Docs</a></nav></header>
<div class="form-wrap">
  <h1>Request a demo</h1>
  <p class="sub">Tell us a little about your team and we will reply within one business day.</p>
  <form id="form">
    <label for="name">Full name</label><input type="text" id="name" required>
    <label for="email">Work email</label><input type="email" id="email" required>
    <label for="size">Team size</label>
    <select id="size" required><option value="">Choose one</option><option>1 to 5</option><option>6 to 20</option><option>21 to 100</option><option>100+</option></select>
    <label for="message">What would you like to see?</label><textarea id="message"></textarea>
    <label class="check"><input type="checkbox" id="consent" required> I agree to be contacted about Acme Cloud</label>
    <p><button class="button" id="send" type="submit" disabled>Send request</button></p>
  </form>
  <div class="notice" id="notice"></div>
</div>
<script src="common.js"></script>
<script>
  var form = document.getElementById('form');
  var send = document.getElementById('send');
  function check() { send.disabled = !form.checkValidity(); }
  form.addEventListener('input', check);
  form.addEventListener('change', check);
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var values = { name: document.getElementById('name').value, email: document.getElementById('email').value, size: document.getElementById('size').value,
      message: document.getElementById('message').value, consent: document.getElementById('consent').checked };
    post('t2', values).then(function () { form.reset(); check(); showNotice('Thanks! We have your request and will be in touch within one business day.'); });
  });
</script>
</body></html>
