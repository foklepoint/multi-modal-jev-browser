<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact - Acme Cloud</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><span class="logo">Acme Cloud</span><nav><a href="#">Pricing</a><a href="#">Docs</a></nav></header>
<div class="form-wrap">
  <h1>Contact us</h1>
  <p class="sub">Questions about plans or limits? Write to the team.</p>
  <form id="form">
    <label for="name">Your name</label><input type="text" id="name" required>
    <label for="email">Email</label><input type="email" id="email" required>
    <label for="message">Message</label><textarea id="message" required></textarea>
    <p><button class="button" type="submit">Send message</button></p>
  </form>
  <div class="notice" id="notice"></div>
</div>
<script src="common.js"></script>
<script>
  document.getElementById('form').addEventListener('submit', function (event) {
    event.preventDefault();
    post('t1', { name: document.getElementById('name').value, email: document.getElementById('email').value, message: document.getElementById('message').value })
      .then(function () { document.getElementById('form').reset(); showNotice('Thanks! Your message was sent and we will reply soon.'); });
  });
</script>
</body></html>
